{% set name = "pytransit" %}
{% set version = "2.12.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pytransit-{{ version }}.tar.gz
  sha256: 93236bedb5eaa601c07b73155a38f8bfe99f3bf2c7b1786dfd34924908e37f60

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
    
  run:
    - python >={{ python_min }}
    - arviz
    - numpy >=2.0.0
    - scipy
    - pandas
    - xarray
    - pytables
    - uncertainties
    - numba
    - astropy-base
    - matplotlib-base
    - mako
    - tqdm
    - semantic_version
    - setuptools
    - deprecated
    - seaborn
    - emcee
    - pyopencl
    - corner
    - celerite
    - pyrr
    - meepmeep >=1.2.1

test:
  imports:
    - pytransit
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Fast and painless exoplanet transit light curve modelling.
  license: GPL-2.0-only
  license_file: LICENSE
  home: https://github.com/hpparvi/PyTransit

extra:
  recipe-maintainers:
    - mwcraig
    - hpparvi
