{% set name = "pytransit" %}
{% set version = "2.9.3" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pytransit-{{ version }}.tar.gz
  sha256: 7d47c6bd33c8bc051086c938392d2ac5dd8c0c6fb7bb76dfae72811ee0921d60

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - arviz
    - numpy >=2.0.0
    - scipy
    - pandas
    - xarray
    - pytables
    - uncertainties
    - numba
    - astropy-base
    - matplotlib-base
    - tqdm
    - semantic_version
    - setuptools
    - deprecated
    - seaborn
    - emcee
    - pyopencl
    - corner
    - celerite
    - meepmeep >=1.2.1

test:
  imports:
    - pytransit
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Fast and painless exoplanet transit light curve modelling.
  license: GPL-2.0-only
  license_file: LICENSE
  home: https://github.com/hpparvi/PyTransit

extra:
  recipe-maintainers:
    - mwcraig
    - hpparvi
